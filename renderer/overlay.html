<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>JLyric Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="overlay" class="overlay">
    <!-- Close button -->
    <button id="closeBtn" class="close-btn" title="关闭 (Esc)">&times;</button>
    <!-- Click-through status indicator -->
    <div id="status" class="status-indicator" title="点击穿透已开启 (Ctrl+Shift+T 切换)">⊘ 穿透</div>
    <!-- Current line -->
    <div class="lyric-block current">
      <div id="currentText" class="text-original"></div>
      <div id="currentReading" class="text-reading"></div>
      <div id="currentTranslation" class="text-translation"></div>
      <!-- Word-level analysis -->
      <div id="currentAnalysis" class="word-cards hidden"></div>
    </div>
    <!-- Next line -->
    <div class="lyric-block next">
      <div id="nextText" class="text-original-small"></div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
